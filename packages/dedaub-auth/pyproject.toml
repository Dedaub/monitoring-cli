[project]
name = "dedaub-auth"
version = "0.1.0"
description = "Dedaub login (Keycloak device flow, token refresh) and the credentials file shared by the Dedaub CLIs."
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.27.0,<0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# A regular package (has __init__.py) with httpx as its only dependency, so
# other Dedaub CLIs can depend on just this, as a path or git-subdirectory
# reference, without pulling dedaub-monitoring.
[tool.hatch.build.targets.wheel]
packages = ["dedaub_auth"]

# uv rebuilds a path package only when a cache key changes, and the default key
# is pyproject.toml alone. Key on the source too, so a change reaches consumers
# without a version bump.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "dedaub_auth/**" }]
