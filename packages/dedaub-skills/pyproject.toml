[project]
name = "dedaub-skills"
version = "0.1.0"
description = "Data-only package shipping the dedaub-monitoring skill markdown (SKILL.md + references/)."
requires-python = ">=3.13,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Data-only package: a regular package (has __init__.py) shipping the skill
# markdown resources, read by consumers via importlib.resources. ZERO runtime
# dependencies on purpose so external consumers can depend on just this via a
# git-subdirectory reference without pulling the CLI or its deps.
[tool.hatch.build.targets.wheel]
packages = ["dedaub_skills"]
