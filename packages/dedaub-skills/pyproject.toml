[project]
name = "dedaub-skills"
version = "0.1.0"
description = "Data-only package shipping the dedaub-monitoring skill markdown (SKILL.md + references/)."
requires-python = ">=3.13,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Data-only package: a regular package (has __init__.py) shipping the skill
# markdown resources, read by consumers via importlib.resources. ZERO runtime
# dependencies on purpose so external consumers can depend on just this via a
# git-subdirectory reference without pulling the CLI or its deps.
[tool.hatch.build.targets.wheel]
packages = ["dedaub_skills"]

# uv rebuilds a path package only when a cache key changes, and the default key
# is pyproject.toml alone. Key on the shipped markdown too, so an edited
# reference reaches `uv tool install` without a version bump.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "dedaub_skills/**" }]
